<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191933">
  <title>Griffin</title>
  <script>
    // The fee calculator now lives inside the main Griffin app, on its Fees tab.
    // Keep any ?name= from an old personal link and open the Fees tab.
    var q = new URLSearchParams(location.search);
    q.set('tab', 'fees');
    location.replace(new URL('../', location.href).pathname + '?' + q.toString());
  </script>
</head>
<body style="font-family:system-ui,sans-serif;background:#191933;color:#fff;padding:24px">
  <p>Opening the Griffin app…</p>
  <p><a style="color:#fff" href="../?tab=fees">Tap here if nothing happens</a></p>
</body>
</html>
